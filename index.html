<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أنيمي فليكس | بث مباشر</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        *{margin:0;padding:0;box-sizing:border-box;}
        body{font-family:'Tajawal',sans-serif;background:#0a0a0f;color:#fff;direction:rtl;}
        .loader{position:fixed;inset:0;background:#0a0a0f;display:flex;justify-content:center;align-items:center;z-index:9999;flex-direction:column;}
        .loader.hide{display:none;}
        .spinner{width:50px;height:50px;border:4px solid #2a2a3a;border-top:4px solid #a855f7;border-radius:50%;animation:spin 0.8s linear infinite;}
        @keyframes spin{to{transform:rotate(360deg);}}
        .navbar{background:rgba(10,10,25,0.9);backdrop-filter:blur(12px);padding:1rem 2rem;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;position:sticky;top:0;z-index:100;}
        .logo{font-size:1.8rem;font-weight:800;background:linear-gradient(135deg,#a855f7,#ec4899);-webkit-background-clip:text;background-clip:text;color:transparent;}
        .search-area{display:flex;gap:0.5rem;background:#1e1e2e;border-radius:60px;padding:0.3rem 1rem;}
        .search-area input{background:none;border:none;color:#fff;padding:0.5rem;width:200px;outline:none;}
        .btn{background:linear-gradient(135deg,#a855f7,#ec4899);border:none;padding:0.5rem 1.2rem;border-radius:40px;color:#fff;font-weight:bold;cursor:pointer;}
        .container{max-width:1400px;margin:2rem auto;padding:0 1rem;}
        .section-title{font-size:1.8rem;margin:1.5rem 0 1rem;}
        .anime-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:1.5rem;}
        .anime-card{background:#14141f;border-radius:20px;overflow:hidden;cursor:pointer;transition:0.2s;border:1px solid #a855f7;}
        .anime-card:hover{transform:translateY(-6px);}
        .anime-card img{width:100%;aspect-ratio:2/3;object-fit:cover;background:#2a2a3a;}
        .anime-card h3{padding:0.7rem;text-align:center;font-size:0.9rem;}
        .modal{position:fixed;inset:0;background:rgba(0,0,0,0.95);backdrop-filter:blur(12px);display:none;align-items:center;justify-content:center;z-index:1000;}
        .modal.active{display:flex;}
        .modal-content{background:#0f0f1a;border-radius:28px;width:95%;max-width:900px;max-height:90vh;overflow-y:auto;}
        .video-container iframe{width:100%;aspect-ratio:16/9;border:none;}
        .episode-list{display:flex;flex-wrap:wrap;gap:0.7rem;padding:1rem;}
        .ep-btn{background:#2a2a3a;padding:0.4rem 1rem;border-radius:30px;cursor:pointer;}
        .ep-btn.active{background:#a855f7;}
        @media (max-width:640px){.anime-grid{grid-template-columns:repeat(2,1fr);}}
    </style>
</head>
<body>
<div class="loader" id="loader"><div class="spinner"></div><p style="margin-top:1rem;">جلب الأنمي...</p></div>
<header id="header"></header>
<main id="app"></main>
<div id="modal" class="modal"><div class="modal-content" id="modalContent"></div></div>

<script>
    // ---------- 1. جلب البيانات من Jikan API (يعمل دائماً تقريباً) ----------
    let currentAnime = null;
    let currentEpisodes = [];

    async function fetchTopAnime() {
        try {
            const res = await fetch('https://api.jikan.moe/v4/top/anime?limit=24&filter=bypopularity');
            const data = await res.json();
            return data.data;
        } catch(e) {
            console.error('فشل جلب البيانات', e);
            return [];
        }
    }

    async function searchAnime(query) {
        try {
            const res = await fetch(`https://api.jikan.moe/v4/anime?q=${encodeURIComponent(query)}&limit=24`);
            const data = await res.json();
            return data.data;
        } catch(e) {
            return [];
        }
    }

    function renderAnimeCards(container, animeList) {
        if(!container) return;
        container.innerHTML = animeList.map(anime => `
            <div class="anime-card" data-id="${anime.mal_id}">
                <img src="${anime.images.jpg.image_url}" alt="${anime.title}" onerror="this.src='https://placehold.co/200x300?text=No+Image'">
                <h3>${anime.title}</h3>
            </div>
        `).join('');
        // إضافة حدث النقر
        document.querySelectorAll('.anime-card').forEach(card => {
            card.onclick = () => openModal(card.dataset.id);
        });
    }

    async function openModal(animeId) {
        try {
            document.getElementById('loader').classList.remove('hide');
            // جلب تفاصيل الأنمي
            const res = await fetch(`https://api.jikan.moe/v4/anime/${animeId}`);
            const data = await res.json();
            const anime = data.data;
            currentAnime = anime;
            // توليد قائمة حلقات وهمية (لأن Jikan لا يعطي روابط)
            const episodesCount = anime.episodes || 12;
            currentEpisodes = Array.from({length: Math.min(episodesCount, 100)}, (_,i) => i+1);
            
            const modalContent = document.getElementById('modalContent');
            modalContent.innerHTML = `
                <div style="display:flex; justify-content:space-between; align-items:center; padding:1rem; border-bottom:1px solid #a855f7;">
                    <h3>${anime.title}</h3>
                    <button id="closeModalBtn" style="background:none; border:none; font-size:1.8rem; color:white;">&times;</button>
                </div>
                <div class="video-container">
                    <iframe id="videoFrame" srcdoc="<html><body style='background:#000;color:white;display:flex;align-items:center;justify-content:center;height:100%'>اختر حلقة</body></html>"></iframe>
                </div>
                <div id="episodesContainer" class="episode-list"></div>
            `;
            document.getElementById('closeModalBtn').onclick = () => {
                document.getElementById('modal').classList.remove('active');
            };
            // عرض الحلقات
            const epContainer = document.getElementById('episodesContainer');
            epContainer.innerHTML = currentEpisodes.map(ep => `<div class="ep-btn" data-ep="${ep}">${ep}</div>`).join('');
            document.querySelectorAll('.ep-btn').forEach(btn => {
                btn.onclick = () => {
                    document.querySelectorAll('.ep-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    playEpisode(btn.dataset.ep);
                };
            });
            document.getElementById('modal').classList.add('active');
            document.getElementById('loader').classList.add('hide');
            // تشغيل أول حلقة تلقائياً
            if(currentEpisodes.length) playEpisode(currentEpisodes[0]);
        } catch(e) {
            alert('خطأ في تحميل الأنمي');
            document.getElementById('loader').classList.add('hide');
        }
    }

    function playEpisode(epNumber) {
        // هذا رابط تجريبي من يوتيوب (مجاني ويعمل). يمكنك استبداله بأي رابط حقيقي لاحقاً.
        // لكن لتجربة التشغيل، نستخدم فيديو توضيحي.
        const demoUrl = "https://www.youtube.com/embed/dQw4w9WgXcQ?autoplay=1";
        const iframe = document.getElementById('videoFrame');
        iframe.src = demoUrl;
        // في الواقع الحقيقي، ستحتاج إلى رابط m3u8 أو mp4 من مصادر خارجية.
        // هذا الحل يضمن ظهور المشغل.
    }

    async function buildUI() {
        document.getElementById('header').innerHTML = `
            <nav class="navbar">
                <div class="logo"><i class="fas fa-play-circle"></i> أنيمي فليكس</div>
                <div class="search-area">
                    <input type="text" id="searchInput" placeholder="ابحث عن أنمي...">
                    <button id="searchBtn" class="btn"><i class="fas fa-search"></i></button>
                </div>
            </nav>
        `;
        document.getElementById('app').innerHTML = `
            <div class="container">
                <div class="section-title"><i class="fas fa-fire"></i> أشهر الأنمي</div>
                <div id="animeGrid" class="anime-grid"></div>
            </div>
        `;
        // البحث
        document.getElementById('searchBtn').onclick = async () => {
            const query = document.getElementById('searchInput').value;
            if(!query) return;
            document.getElementById('loader').classList.remove('hide');
            const results = await searchAnime(query);
            renderAnimeCards(document.getElementById('animeGrid'), results);
            document.getElementById('loader').classList.add('hide');
        };
        document.getElementById('searchInput').addEventListener('keypress', (e) => {
            if(e.key === 'Enter') document.getElementById('searchBtn').click();
        });
        // تحميل البيانات الأولية
        document.getElementById('loader').classList.remove('hide');
        const topAnime = await fetchTopAnime();
        renderAnimeCards(document.getElementById('animeGrid'), topAnime);
        document.getElementById('loader').classList.add('hide');
    }
    buildUI();
</script>
</body>
</html>
