<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anime Flix - منصة أنيمي فليكس</title>
    <!-- مكتبات خارجية -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- الخلفية المتحركة -->
    <div class="bg-animation"></div>

    <!-- الهيدر -->
    <header>
        <div class="logo">ANIME <span>FLIX</span></div>
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="ابحث عن أنمي... (مثال: One Piece)">
            <button onclick="searchAnime()"><i class="fas fa-search"></i></button>
        </div>
    </header>

    <!-- المحتوى الرئيسي -->
    <main id="mainContent">
        <h2 class="section-title">🔥 أحدث الإضافات</h2>
        <div class="anime-grid" id="animeGrid">
            <!-- سيتم ملء البطاقات هنا بواسطة الجافاسكربت -->
        </div>
    </main>

    <!-- نافذة المشاهدة (Modal) -->
    <div id="playerModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal()">&times;</span>
            
            <div class="player-container">
                <video id="videoPlayer" controls></video>
            </div>

            <div class="anime-info">
                <h2 id="animeTitle">عنوان الأنمي</h2>
                <div class="server-list" id="serverList">
                    <!-- أزرار السيرفرات -->
                </div>
            </div>

            <div class="episodes-container">
                <h3>قائمة الحلقات</h3>
                <div class="episodes-grid" id="episodesGrid">
                    <!-- قائمة الحلقات -->
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
